schema_version: "1.1"
name: meta-ads-breakdown
expected_outcome: |
  A report and CSV that break down competitor ads (Factor, HelloFresh, CookUnity) into hook,
  offer, format, angle, awareness level, proof, and CTA, based on ads actually retrieved from
  the Meta Ad Library or supplied sources, with the snapshot date noted. Patterns across the
  set are summarized, and 6 to 10 original ad concepts for the meal-prep business are
  proposed with hooks written out. If the ad library could not be read, the report says so
  and asks for screenshots instead of inventing ads.
